name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout interface-language
        uses: actions/checkout@v5

      - name: Checkout mundus
        uses: actions/checkout@v5
        with:
          repository: CMZN-Consulting/mundus
          path: ../mundus

      - name: Checkout memory-artifact
        uses: actions/checkout@v5
        with:
          repository: CMZN-Consulting/memory-artifact
          path: ../memory-artifact

      - name: Build interface-language
        uses: leanprover/lean-action@v1
